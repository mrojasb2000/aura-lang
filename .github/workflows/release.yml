name: Build & Publish Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package binaries (.tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/aurac staging/
          cp target/${{ matrix.target }}/release/aurafmt staging/
          cp target/${{ matrix.target }}/release/auratest staging/
          cp target/${{ matrix.target }}/release/auralsp staging/
          tar -czvf "aura-${{ matrix.target }}.tar.gz" -C staging .
        shell: bash

      - name: Package binaries (.zip)
        if: matrix.archive == 'zip'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/aurac.exe staging/
          cp target/${{ matrix.target }}/release/aurafmt.exe staging/
          cp target/${{ matrix.target }}/release/auratest.exe staging/
          cp target/${{ matrix.target }}/release/auralsp.exe staging/
          7z a -tzip "aura-${{ matrix.target }}.zip" ./staging/*
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            aura-${{ matrix.target }}.${{ matrix.archive }}
